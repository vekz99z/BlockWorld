name: Build Windows Game

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_win64.exe.zip" `
            -OutFile godot.zip

          Expand-Archive godot.zip -DestinationPath godot

          Get-ChildItem godot -Recurse

      - name: Download export templates
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" `
            -OutFile templates.tpz

          Expand-Archive templates.tpz -DestinationPath templates

          New-Item -ItemType Directory -Force `
            -Path "$env:APPDATA\Godot\export_templates\4.5.1.stable"

          Copy-Item `
            "templates\templates\*" `
            "$env:APPDATA\Godot\export_templates\4.5.1.stable\" `
            -Recurse `
            -Force

          Get-ChildItem `
            "$env:APPDATA\Godot\export_templates\4.5.1.stable" `
            -Recurse

      - name: Create export preset
        shell: pwsh
        run: |
          @'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BlockWorld.exe"

          [preset.0.options]
          binary_format/architecture="x86_64"
          binary_format/embed_pck=true
          application/config/name="BlockWorld"
          application/run/main_scene="res://scenes/main.tscn"
          '@ | Set-Content export_presets.cfg -Encoding UTF8

      - name: Verify project
        shell: pwsh
        run: |
          Get-ChildItem
          Get-Content project.godot
          Get-Content export_presets.cfg

      - name: Export game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build

          $godot = Get-ChildItem "godot" -Filter "*.exe" -Recurse | Select-Object -First 1

          Write-Host "Using Godot:"
          Write-Host $godot.FullName

          & $godot.FullName `
            --headless `
            --path "$PWD" `
            --export-release "Windows Desktop" `
            "$PWD\build\BlockWorld.exe"

          Write-Host "Godot exit code: $LASTEXITCODE"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check build
        shell: pwsh
        run: |
          Write-Host "BUILD DIRECTORY:"
          Get-ChildItem build -Force

          if (!(Test-Path "build\BlockWorld.exe")) {
            Write-Error "BlockWorld.exe was NOT created."
            exit 1
          }

          Write-Host "SUCCESS! BlockWorld.exe exists."

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-Windows
          path: build\BlockWorld.exe
